{% if analysis %}
<span class="ai-badge mb-2"><i class="fas fa-magic"></i> AI analysis</span>
<div class="ai-teaser-headline">{{ analysis.headline }}</div>
{% if analysis.insights %}
<ul class="ai-insights compact">
    {% for item in analysis.insights|slice:":2" %}
    <li class="tone-{{ item.tone }}">
        <i class="fas {% if item.tone == 'critical' %}fa-exclamation-circle{% elif item.tone == 'warning' %}fa-exclamation-triangle{% elif item.tone == 'positive' %}fa-check-circle{% else %}fa-info-circle{% endif %}" aria-hidden="true"></i>
        <div class="ai-insight-title">{{ item.title }}</div>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="small text-muted mb-0">{{ analysis.summary }}</p>
{% endif %}
{% endif %}
