{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Something went wrong{% endblock %} · SAS</title>
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
    <main class="error-page">
        <div>
            <div class="error-code">{% block code %}{% endblock %}</div>
            <h1 class="h4 mt-3">{% block heading %}{% endblock %}</h1>
            <p class="text-muted" style="max-width:420px;margin:0 auto 1.5rem">{% block message %}{% endblock %}</p>
            <a class="btn btn-primary" href="/dashboard/">Back to dashboard</a>
        </div>
    </main>
</body>
</html>
