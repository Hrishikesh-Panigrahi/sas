{% for message in messages %}
<div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="{% if message.level >= 30 %}alert{% else %}status{% endif %}">
    <i class="fas {% if message.tags == 'success' %}fa-check-circle{% elif message.tags == 'danger' %}fa-exclamation-circle{% elif message.tags == 'warning' %}fa-exclamation-triangle{% else %}fa-info-circle{% endif %}"></i>
    <div>{{ message }}</div>
    <button type="button" class="close" data-dismiss="alert" aria-label="Dismiss">&times;</button>
</div>
{% endfor %}
