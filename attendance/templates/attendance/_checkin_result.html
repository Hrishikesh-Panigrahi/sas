{% if ok %}
<div class="checkin-result ok" role="status">
    <div class="checkin-result-icon"><i class="fas fa-check"></i></div>
    <h1 class="h4">{{ ok }}</h1>
    {% if lecture %}<p class="text-muted mb-0">{{ lecture.assign.course.name }} · {{ lecture.assign.cls.class_name }}<br>{% now "H:i" %}, {% now "l j F" %}</p>{% endif %}
</div>
{% elif error %}
<div class="checkin-result bad" role="alert">
    <div class="checkin-result-icon"><i class="fas fa-times"></i></div>
    <h1 class="h5">Couldn't check you in</h1>
    <p class="text-muted">{{ error }}</p>
</div>
{% endif %}
